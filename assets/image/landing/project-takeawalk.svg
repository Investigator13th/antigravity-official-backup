<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#10131a" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <linearGradient id="curve-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#34a853" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#4285f4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8ab4f8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="curve-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#34a853" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-1" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad-1)" />
  <rect width="1280" height="720" fill="url(#grid-1)" />

  <!-- Ambient Light Orbs -->
  <circle cx="480" cy="360" r="280" fill="#1a73e8" opacity="0.12" filter="url(#glow-1)" />
  <circle cx="820" cy="420" r="220" fill="#34a853" opacity="0.09" filter="url(#glow-1)" />

  <!-- Technical Overlay HUD Elements -->
  <g opacity="0.45" font-family="'Google Sans Flex', -apple-system, monospace" font-size="11" fill="#8ab4f8" letter-spacing="1.5">
    <text x="64" y="68">MODULE // TAKE_A_WALK</text>
    <text x="64" y="86" fill="rgba(255,255,255,0.4)">LBS_COORDINATES: TENCENT_MAP_API</text>
    <text x="1100" y="68" text-anchor="end">FALLBACK: ZERO_HALLUCINATION</text>
    <text x="1100" y="86" text-anchor="end" fill="rgba(255,255,255,0.4)">DEEPSEEK_V3 // PSYCH_ROUTE</text>
  </g>

  <!-- Bezier Stream Flow Curves (Pedestrian Walking Dynamics) -->
  <g fill="none">
    <!-- Base flow paths -->
    <path d="M -50 480 C 240 520, 380 240, 640 320 C 900 400, 1020 180, 1330 220" stroke="rgba(66, 133, 244, 0.25)" stroke-width="4" />
    <path d="M -50 420 C 280 460, 420 180, 680 260 C 940 340, 1060 120, 1330 160" stroke="rgba(52, 168, 83, 0.2)" stroke-width="2" stroke-dasharray="6,6" />
    
    <!-- Hero glowing Bezier waves -->
    <path d="M -50 540 C 260 590, 400 310, 660 380 C 920 450, 1040 230, 1330 280" stroke="url(#curve-grad-1)" stroke-width="4.5" filter="url(#glow-1)" />
    <path d="M -50 360 C 220 300, 440 480, 720 360 C 960 260, 1100 420, 1330 350" stroke="url(#curve-grad-2)" stroke-width="3" filter="url(#glow-1)" />
  </g>

  <!-- Route Points / Waypoints -->
  <g fill="#ffffff">
    <circle cx="360" cy="380" r="4.5" fill="#34a853" filter="url(#glow-1)" />
    <circle cx="360" cy="380" r="1.5" fill="#ffffff" />
    <circle cx="660" cy="380" r="7" fill="#4285f4" opacity="0.3" filter="url(#glow-1)" />
    <circle cx="660" cy="380" r="4" fill="#4285f4" />
    <circle cx="660" cy="380" r="1.5" fill="#ffffff" />
    <circle cx="980" cy="285" r="5" fill="#00e5ff" filter="url(#glow-1)" />
    <circle cx="980" cy="285" r="2" fill="#ffffff" />
  </g>

  <!-- Pulse Circles -->
  <circle cx="660" cy="380" r="28" fill="none" stroke="rgba(66, 133, 244, 0.4)" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="660" cy="380" r="54" fill="none" stroke="rgba(66, 133, 244, 0.2)" stroke-width="1" />

  <!-- Footprint / Compass subtle hint -->
  <g transform="translate(64, 630)" opacity="0.6">
    <rect width="180" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="20" cy="16" r="4" fill="#34a853" />
    <text x="34" y="20" font-family="'Google Sans Flex', sans-serif" font-size="12" fill="#ffffff" font-weight="500">Live POI Connected</text>
  </g>
</svg>
