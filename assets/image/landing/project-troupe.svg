<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d" />
      <stop offset="50%" stop-color="#120f1f" />
      <stop offset="100%" stop-color="#07060a" />
    </linearGradient>
    <linearGradient id="mesh-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="mesh-grad-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad-2)" />
  <rect width="1280" height="720" fill="url(#grid-2)" />

  <!-- Ambient Light Orbs -->
  <circle cx="540" cy="340" r="300" fill="#9333ea" opacity="0.1" filter="url(#glow-2)" />
  <circle cx="780" cy="400" r="240" fill="#3b82f6" opacity="0.08" filter="url(#glow-2)" />

  <!-- Technical Overlay HUD Elements -->
  <g opacity="0.45" font-family="'Google Sans Flex', -apple-system, monospace" font-size="11" fill="#c084fc" letter-spacing="1.5">
    <text x="64" y="68">SYSTEM // TROUPE_SHOWCASE</text>
    <text x="64" y="86" fill="rgba(255,255,255,0.4)">DEEPSEEK_HARNESS // OPEN-HARNESS MESH</text>
    <text x="1100" y="68" text-anchor="end">TOPOLOGY: AGENT_SWARM_V2</text>
    <text x="1100" y="86" text-anchor="end" fill="rgba(255,255,255,0.4)">SKILLS_INTERCONNECT: ACTIVE</text>
  </g>

  <!-- Multi-Agent Interconnected Neural Mesh (Bezier Networks) -->
  <g fill="none">
    <!-- Secondary background connections -->
    <path d="M 220 200 C 380 340, 560 160, 720 280 C 880 400, 1020 260, 1180 320" stroke="rgba(168, 85, 247, 0.2)" stroke-width="2" stroke-dasharray="4,6" />
    <path d="M 120 480 C 320 320, 540 520, 780 360 C 980 220, 1120 460, 1240 380" stroke="rgba(236, 72, 153, 0.2)" stroke-width="2" />

    <!-- Hero Curved Stream Lines -->
    <path d="M -40 440 C 260 220, 480 540, 760 300 C 960 140, 1120 400, 1320 260" stroke="url(#mesh-grad-1)" stroke-width="4.5" filter="url(#glow-2)" />
    <path d="M -40 280 C 220 480, 460 180, 720 420 C 940 560, 1140 220, 1320 380" stroke="url(#mesh-grad-2)" stroke-width="3.5" filter="url(#glow-2)" />
  </g>

  <!-- Agent Swarm Nodes & Intersect Rings -->
  <g fill="#ffffff">
    <!-- Node 1 -->
    <circle cx="340" cy="370" r="6" fill="#a855f7" filter="url(#glow-2)" />
    <circle cx="340" cy="370" r="2" fill="#ffffff" />
    <circle cx="340" cy="370" r="22" fill="none" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Central Node 2 (Coordinator) -->
    <circle cx="680" cy="320" r="9" fill="#ec4899" filter="url(#glow-2)" />
    <circle cx="680" cy="320" r="4" fill="#ffffff" />
    <circle cx="680" cy="320" r="38" fill="none" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" />
    <circle cx="680" cy="320" r="62" fill="none" stroke="rgba(236, 72, 153, 0.15)" stroke-width="1" stroke-dasharray="6,6" />

    <!-- Node 3 -->
    <circle cx="960" cy="240" r="6" fill="#60a5fa" filter="url(#glow-2)" />
    <circle cx="960" cy="240" r="2" fill="#ffffff" />
    <circle cx="960" cy="240" r="20" fill="none" stroke="rgba(96, 165, 250, 0.35)" stroke-width="1.2" />

    <!-- Node 4 -->
    <circle cx="840" cy="460" r="5" fill="#c084fc" filter="url(#glow-2)" />
    <circle cx="840" cy="460" r="1.5" fill="#ffffff" />
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(64, 630)" opacity="0.6">
    <rect width="190" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="20" cy="16" r="4" fill="#a855f7" />
    <text x="34" y="20" font-family="'Google Sans Flex', sans-serif" font-size="12" fill="#ffffff" font-weight="500">Agent Swarm Active</text>
  </g>
</svg>
