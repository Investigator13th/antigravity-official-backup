<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    <linearGradient id="anchor-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="anchor-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-3" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad-3)" />
  <rect width="1280" height="720" fill="url(#grid-3)" />

  <!-- Ambient Light Orbs -->
  <circle cx="640" cy="360" r="320" fill="#2563eb" opacity="0.1" filter="url(#glow-3)" />
  <circle cx="860" cy="320" r="220" fill="#f59e0b" opacity="0.08" filter="url(#glow-3)" />

  <!-- Technical Overlay HUD Elements -->
  <g opacity="0.45" font-family="'Google Sans Flex', -apple-system, monospace" font-size="11" fill="#93c5fd" letter-spacing="1.5">
    <text x="64" y="68">ENGINE // ANCHOR_PM_HARNESS</text>
    <text x="64" y="86" fill="rgba(255,255,255,0.4)">STATE_MACHINE: DETERMINISTIC_EVAL</text>
    <text x="1100" y="68" text-anchor="end">REGRESSION_TESTS: 100% COVERAGE</text>
    <text x="1100" y="86" text-anchor="end" fill="rgba(255,255,255,0.4)">STATUS: IN_DEVELOPMENT</text>
  </g>

  <!-- Ground Truth Baseline & Mathematical Axes -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1.2">
    <line x1="120" y1="360" x2="1160" y2="360" stroke-dasharray="6,4" />
    <line x1="640" y1="120" x2="640" y2="600" stroke-dasharray="6,4" />
  </g>

  <!-- Converging Waves (Fluctuation Converging to Fixed Anchor Baseline) -->
  <g fill="none">
    <!-- Unstable wide wave fading into stability -->
    <path d="M -40 480 C 240 600, 380 180, 640 360 C 900 360, 1080 360, 1320 360" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2.5" />
    <path d="M -40 240 C 220 120, 420 540, 640 360 C 880 360, 1060 360, 1320 360" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Hero Flow Curves -->
    <path d="M -40 520 C 220 580, 400 220, 640 360 C 860 360, 1080 360, 1320 360" stroke="url(#anchor-grad-1)" stroke-width="4.5" filter="url(#glow-3)" />
    <path d="M -40 200 C 240 140, 440 500, 640 360 C 880 360, 1080 360, 1320 360" stroke="url(#anchor-grad-2)" stroke-width="3" filter="url(#glow-3)" />
  </g>

  <!-- Central Anchor Point (The Ground Truth Node) -->
  <g fill="#ffffff">
    <circle cx="640" cy="360" r="10" fill="#f59e0b" filter="url(#glow-3)" />
    <circle cx="640" cy="360" r="4.5" fill="#ffffff" />
    <circle cx="640" cy="360" r="32" fill="none" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5" />
    <circle cx="640" cy="360" r="64" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="640" cy="360" r="96" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Confidence Intervals / Evaluation Steppers -->
  <g fill="#93c5fd" opacity="0.8" font-family="'Google Sans Flex', monospace" font-size="10">
    <text x="760" y="348">CONFIDENCE: 99.4%</text>
    <circle cx="750" cy="345" r="3" fill="#38bdf8" />
    <text x="940" y="348">DRIFT: 0.00%</text>
    <circle cx="930" cy="345" r="3" fill="#10b981" />
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(64, 630)" opacity="0.6">
    <rect width="210" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="20" cy="16" r="4" fill="#f59e0b" />
    <text x="34" y="20" font-family="'Google Sans Flex', sans-serif" font-size="12" fill="#ffffff" font-weight="500">Deterministic Evaluation</text>
  </g>
</svg>
